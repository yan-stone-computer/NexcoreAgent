<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">NexcoreAgent framework composition</title>
  <desc id="desc">Documents and images feed NexcoreFileRead and NexcoreVision; memory recall feeds NexcoreMemory; both enter context governance; the model emits tool calls through NexcoreToolGuard; events become traces.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#0b8797"/>
    </marker>
  </defs>
  <rect width="960" height="540" rx="28" fill="#f7fbfc"/>
  <g font-family="Microsoft YaHei, PingFang SC, sans-serif">
    <text x="48" y="62" font-size="28" font-weight="700" fill="#18323b">NexcoreAgent · thin composition</text>
    <text x="48" y="88" font-size="15" fill="#58737d">Open ports, one inspectable loop, no duplicate database or service</text>

    <g id="inputs">
      <rect x="45" y="130" width="165" height="92" rx="18" fill="#fff" stroke="#bcdce4"/>
      <text x="127" y="168" text-anchor="middle" font-size="18" font-weight="700" fill="#18323b">Documents</text>
      <text x="127" y="196" text-anchor="middle" font-size="13" fill="#58737d">PDF / Office / HTML</text>
      <rect x="45" y="244" width="165" height="92" rx="18" fill="#fff" stroke="#bcdce4"/>
      <text x="127" y="282" text-anchor="middle" font-size="18" font-weight="700" fill="#18323b">Images</text>
      <text x="127" y="310" text-anchor="middle" font-size="13" fill="#58737d">OCR + visual evidence</text>
      <rect x="45" y="358" width="165" height="92" rx="18" fill="#fff" stroke="#bcdce4"/>
      <text x="127" y="396" text-anchor="middle" font-size="18" font-weight="700" fill="#18323b">Workspace</text>
      <text x="127" y="424" text-anchor="middle" font-size="13" fill="#58737d">facts.json / events</text>
    </g>

    <g id="capabilities">
      <rect x="280" y="130" width="190" height="92" rx="18" fill="#e8faf5" stroke="#54d0b1" stroke-width="2"/>
      <text x="375" y="168" text-anchor="middle" font-size="17" font-weight="700" fill="#18323b">NexcoreFileRead</text>
      <text x="375" y="196" text-anchor="middle" font-size="13" fill="#58737d">structured Markdown</text>
      <rect x="280" y="244" width="190" height="92" rx="18" fill="#e8faf5" stroke="#54d0b1" stroke-width="2"/>
      <text x="375" y="282" text-anchor="middle" font-size="17" font-weight="700" fill="#18323b">NexcoreVision</text>
      <text x="375" y="310" text-anchor="middle" font-size="13" fill="#58737d">bounded evidence</text>
      <rect x="280" y="358" width="190" height="92" rx="18" fill="#e8faf5" stroke="#54d0b1" stroke-width="2"/>
      <text x="375" y="396" text-anchor="middle" font-size="17" font-weight="700" fill="#18323b">NexcoreMemory</text>
      <text x="375" y="424" text-anchor="middle" font-size="13" fill="#58737d">FTS → graph → MMR</text>
    </g>

    <g id="core">
      <rect x="535" y="130" width="180" height="320" rx="22" fill="#10272f"/>
      <text x="625" y="176" text-anchor="middle" font-size="20" font-weight="700" fill="#f4fbfc">Context Governor</text>
      <text x="625" y="207" text-anchor="middle" font-size="13" fill="#bad3d9">budget · compact · probe</text>
      <line x1="565" y1="232" x2="685" y2="232" stroke="#42616a"/>
      <text x="625" y="269" text-anchor="middle" font-size="20" font-weight="700" fill="#f4fbfc">Model Port</text>
      <text x="625" y="299" text-anchor="middle" font-size="13" fill="#bad3d9">answer or tool calls</text>
      <line x1="565" y1="324" x2="685" y2="324" stroke="#42616a"/>
      <text x="625" y="361" text-anchor="middle" font-size="20" font-weight="700" fill="#6fe5be">Tool Guard</text>
      <text x="625" y="391" text-anchor="middle" font-size="13" fill="#bad3d9">approval bound to payload</text>
    </g>

    <g id="outputs">
      <rect x="780" y="184" width="130" height="92" rx="18" fill="#fff" stroke="#bcdce4"/>
      <text x="845" y="222" text-anchor="middle" font-size="17" font-weight="700" fill="#18323b">Result</text>
      <text x="845" y="250" text-anchor="middle" font-size="13" fill="#58737d">verified deliverable</text>
      <rect x="780" y="318" width="130" height="92" rx="18" fill="#fff" stroke="#bcdce4"/>
      <text x="845" y="356" text-anchor="middle" font-size="17" font-weight="700" fill="#18323b">Trace</text>
      <text x="845" y="384" text-anchor="middle" font-size="13" fill="#58737d">replayable evidence</text>
    </g>

    <g fill="none" stroke="#0b8797" stroke-width="2.3" marker-end="url(#arrow)">
      <path d="M210 176h55"/>
      <path d="M210 290h55"/>
      <path d="M210 404h55"/>
      <path d="M470 176h48"/>
      <path d="M470 290h48"/>
      <path d="M470 404h48"/>
      <path d="M715 275h48"/>
      <path d="M715 360l45 4"/>
    </g>
  </g>
</svg>
